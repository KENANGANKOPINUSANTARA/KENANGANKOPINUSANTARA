<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78a9c9"/>
      <stop offset="0.55" stop-color="#d9b78d"/>
      <stop offset="1" stop-color="#f1d5a8"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5e52"/>
      <stop offset="1" stop-color="#1f302b"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#314b36"/>
      <stop offset="1" stop-color="#101d18"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="1200" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".55" filter="url(#blur)">
    <ellipse cx="160" cy="280" rx="180" ry="45"/>
    <ellipse cx="620" cy="335" rx="220" ry="52"/>
    <ellipse cx="410" cy="470" rx="260" ry="55"/>
  </g>

  <!-- distant ridges -->
  <path d="M0 520 L115 405 L190 465 L305 340 L395 455 L510 365 L625 470 L710 400 L800 500 V700 H0Z"
        fill="#68756a" opacity=".78"/>
  <path d="M0 625 L105 515 L205 570 L315 435 L410 555 L525 455 L650 575 L735 500 L800 555 V760 H0Z"
        fill="url(#mountain)"/>

  <!-- coffee-growing hills -->
  <path d="M0 735 Q170 620 330 730 T800 680 V1200 H0Z" fill="#35533d"/>
  <path d="M0 850 Q170 720 340 835 T800 790 V1200 H0Z" fill="url(#foreground)"/>

  <!-- terraced fields -->
  <g fill="none" stroke="#6e8a55" stroke-width="12" opacity=".7">
    <path d="M30 870 Q190 790 350 850 T770 820"/>
    <path d="M10 930 Q190 840 370 900 T800 865"/>
    <path d="M0 995 Q190 895 390 955 T800 915"/>
    <path d="M0 1065 Q200 955 410 1015 T800 975"/>
    <path d="M0 1140 Q210 1030 430 1080 T800 1045"/>
  </g>

  <!-- coffee trees -->
  <g fill="#182d20">
    <circle cx="110" cy="820" r="48"/><circle cx="180" cy="790" r="42"/>
    <circle cx="270" cy="850" r="55"/><circle cx="365" cy="815" r="45"/>
    <circle cx="500" cy="875" r="58"/><circle cx="620" cy="820" r="50"/>
    <circle cx="710" cy="885" r="62"/>
  </g>

  <!-- warm atmospheric glow -->
  <ellipse cx="420" cy="610" rx="390" ry="85" fill="url(#mist)" filter="url(#blur)"/>
</svg>